services:
  postgres:
    image: postgis/postgis:16-3.5
    platform: linux/amd64
    container_name: localism-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: localism

    ports:
      - '5433:5432'

    volumes:
      - localism_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d localism']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  localism_pgdata:
    external: true
