services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: localism-api
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '3000'
    command: >
      sh -c "
      pnpm exec prisma migrate deploy &&
      node dist/src/main.js
      "
    networks:
      - localism-network

  postgres:
    image: postgis/postgis:16-3.5
    container_name: localism-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - localism-network

  redis:
    image: redis:7-alpine
    container_name: localism-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    expose:
      - '6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a ${REDIS_PASSWORD} ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - localism-network

  nginx:
    image: nginx:alpine
    container_name: localism-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
    networks:
      - localism-network

volumes:
  postgres-data:
  redis-data:

networks:
  localism-network:
    driver: bridge
